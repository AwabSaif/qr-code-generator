    <style>
        :root {
            --navy: #111A29;
            --navy-2: #182234;
            --navy-3: #1E2A40;
            --gold: #CE9D51;
            --gold-hover: #B8893F;
            --gold-soft: rgba(206, 157, 81, 0.16);
            --text: #F5F4F1;
            --muted: #9AA3B2;
            --border: #2A364C;
            --border-strong: #3A4860;
            --white: #FFFFFF;
            --success: #2F8F63;
            --success-hover: #267552;
            --danger: #C44A3E;
            --danger-hover: #A33B31;
            --radius: 8px;
            --radius-lg: 12px;
            --space-1: 4px;
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-5: 24px;
            --space-6: 32px;
            --font: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
            --max: 980px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: var(--font);
            font-size: 16px;
            line-height: 1.5;
            color: var(--text);
            background: var(--navy);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: var(--space-5) var(--space-4) var(--space-6);
        }

        .app {
            width: 100%;
            max-width: var(--max);
            display: flex;
            flex-direction: column;
            gap: var(--space-5);
            flex: 1;
        }

        .install-banner {
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-4);
            padding: var(--space-3) var(--space-4);
            background: var(--navy-2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }

        .install-banner.show {
            display: flex;
        }

        .install-banner p {
            margin: 0;
            font-size: 0.9375rem;
            color: var(--muted);
        }

        .install-btn {
            flex-shrink: 0;
            border: none;
            border-radius: var(--radius);
            padding: 10px 16px;
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            color: var(--navy);
            background: var(--gold);
        }

        .install-btn:hover {
            background: var(--gold-hover);
        }

        header.top {
            display: flex;
            align-items: center;
            gap: var(--space-4);
            padding-bottom: var(--space-4);
            border-bottom: 1px solid var(--border);
        }

        .brand-logo {
            width: 52px;
            height: 52px;
            border-radius: var(--radius);
            object-fit: cover;
            flex-shrink: 0;
            border: 1px solid var(--border);
            background: var(--white);
        }

        .brand-copy h1 {
            margin: 0 0 2px;
            font-size: 1.375rem;
            font-weight: 700;
            line-height: 1.3;
        }

        .brand-copy p {
            margin: 0;
            font-size: 0.9375rem;
            color: var(--muted);
        }

        .layout {
            display: grid;
            grid-template-columns: 1.05fr 0.95fr;
            gap: var(--space-5);
            align-items: start;
        }

        .panel {
            background: var(--navy-2);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: var(--space-5);
        }

        .panel-title {
            margin: 0 0 var(--space-5);
            font-size: 1rem;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: var(--space-4);
        }

        label {
            display: block;
            margin-bottom: var(--space-2);
            font-size: 0.875rem;
            font-weight: 500;
        }

        input[type="text"],
        input[type="url"] {
            width: 100%;
            height: 44px;
            padding: 0 12px;
            border-radius: var(--radius);
            border: 1px solid var(--border-strong);
            background: var(--navy-3);
            color: var(--text);
            font-family: inherit;
            font-size: 0.9375rem;
            outline: none;
        }

        input::placeholder {
            color: #6B7588;
        }

        input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px var(--gold-soft);
        }

        .color-row {
            display: grid;
            grid-template-columns: 1fr 88px;
            gap: var(--space-2);
            align-items: center;
        }

        input[type="color"] {
            width: 100%;
            height: 44px;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius);
            background: var(--navy-3);
            cursor: pointer;
            padding: 4px;
        }

        .color-hex {
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.8125rem;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--navy);
            color: var(--muted);
        }

        /* Visual shape picker */
        .shape-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--space-2);
        }

        .shape-option {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 12px 8px 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--navy-3);
            cursor: pointer;
            color: var(--muted);
            font-family: inherit;
            font-size: 0.75rem;
            font-weight: 500;
            transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
        }

        .shape-option:hover {
            border-color: var(--border-strong);
            color: var(--text);
        }

        .shape-option[aria-checked="true"] {
            border-color: var(--gold);
            background: var(--gold-soft);
            color: var(--gold);
        }

        .shape-option[aria-checked="true"] .shape-preview {
            border-color: var(--gold);
        }

        .shape-preview {
            width: 56px;
            height: 56px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--white);
            display: grid;
            place-items: center;
            overflow: hidden;
        }

        .shape-preview svg {
            width: 44px;
            height: 44px;
            display: block;
        }

        .shape-option.wide {
            grid-column: span 1;
        }

        .btn-primary {
            width: 100%;
            height: 48px;
            margin-top: var(--space-2);
            border: none;
            border-radius: var(--radius);
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            color: var(--navy);
            background: var(--gold);
        }

        .btn-primary:hover {
            background: var(--gold-hover);
        }

        .preview-panel {
            display: flex;
            flex-direction: column;
        }

        .preview-stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 360px;
            padding: var(--space-5);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--navy);
        }

        .empty-state {
            text-align: center;
            color: var(--muted);
            max-width: 240px;
        }

        .empty-state strong {
            display: block;
            color: var(--text);
            margin-bottom: 4px;
            font-size: 0.9375rem;
            font-weight: 600;
        }

        .empty-state span {
            font-size: 0.875rem;
        }

        #preview-wrapper {
            display: none;
            width: 100%;
            justify-content: center;
            overflow: auto;
        }

        #preview-wrapper.active {
            display: flex;
        }

        #qr-card {
            background-color: #9c0c1c;
            padding: 20px 20px 24px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: fit-content;
            max-width: 100%;
        }

        #qr-inner {
            background: #fff;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #qr-text-display {
            color: #fff;
            margin-top: 16px;
            font-family: ui-monospace, "Courier New", monospace;
            font-size: 1.125rem;
            text-align: center;
            letter-spacing: 0.03em;
            white-space: pre-wrap;
            max-width: 300px;
            word-wrap: break-word;
            line-height: 1.35;
        }

        .actions {
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-3);
            margin-top: var(--space-4);
        }

        .actions.show {
            display: grid;
        }

        .btn-action {
            height: 44px;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 600;
            color: #fff;
        }

        .bg-green {
            background: var(--success);
        }

        .bg-green:hover {
            background: var(--success-hover);
        }

        .bg-red {
            background: var(--danger);
        }

        .bg-red:hover {
            background: var(--danger-hover);
        }

        footer {
            margin-top: auto;
            padding-top: var(--space-2);
            text-align: center;
            color: var(--muted);
            font-size: 0.8125rem;
        }

        footer .logo-mini {
            width: 18px;
            height: 18px;
            border-radius: 4px;
            vertical-align: middle;
            margin-left: 6px;
            border: 1px solid var(--border);
        }

        @media (max-width: 800px) {
            .layout {
                grid-template-columns: 1fr;
            }

            .preview-stage {
                min-height: 280px;
            }
        }

        @media (max-width: 520px) {
            body {
                padding: var(--space-4) var(--space-3) var(--space-5);
            }

            .install-banner {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }

            .panel {
                padding: var(--space-4);
            }

            .shape-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .actions {
                grid-template-columns: 1fr;
            }

            .brand-copy h1 {
                font-size: 1.25rem;
            }
        }
    </style>
</head>

                shapeOptions.forEach((b) => b.setAttribute("aria-checked", "false"));
                btn.setAttribute("aria-checked", "true");
                shapeInput.value = btn.dataset.shape;
            });
        });

        const manifestData = {
            name: "QR Code Generator — Awab Saif",
            short_name: "QR Maker",
            description: "إنشاء QR Code احترافي مجاني مع تخصيص الألوان والتحميل",
            start_url: ".",
            scope: ".",
            display: "standalone",
            orientation: "any",
            background_color: "#111A29",
            theme_color: "#111A29",
            lang: "ar",
            dir: "rtl",
            icons: [
                { src: LOGO_DATA_URI, sizes: "any", type: "image/svg+xml", purpose: "any" },
                { src: LOGO_DATA_URI, sizes: "512x512", type: "image/svg+xml", purpose: "maskable" }
            ]
        };

        const manifestBlob = new Blob([JSON.stringify(manifestData)], { type: "application/manifest+json" });
        document.getElementById("manifest-link").href = URL.createObjectURL(manifestBlob);

        const swCode = `
      const CACHE = 'qr-awab-v5';
      const ASSETS = [
        self.registration.scope,
        'https://cdn.jsdelivr.net/npm/qr-code-styling@1.5.0/lib/qr-code-styling.js',
        'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
        'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
        'https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap'
      ];
      self.addEventListener('install', (e) => {
        e.waitUntil(caches.open(CACHE).then((c) => c.addAll(ASSETS)).then(() => self.skipWaiting()));
      });
      self.addEventListener('activate', (e) => {
        e.waitUntil(
          caches.keys().then((keys) => Promise.all(keys.filter((k) => k !== CACHE).map((k) => caches.delete(k))))
            .then(() => clients.claim())
        );
      });
      self.addEventListener('fetch', (e) => {
        e.respondWith(
          caches.match(e.request).then((cached) => {
            const fetched = fetch(e.request).then((res) => {
              if (res && res.ok && e.request.method === 'GET') {
                const clone = res.clone();
                caches.open(CACHE).then((c) => c.put(e.request, clone));
              }
              return res;
            }).catch(() => cached);
            return cached || fetched;
          })
        );
      });
    `;

        if ("serviceWorker" in navigator) {
            const swBlob = new Blob([swCode], { type: "application/javascript" });
            navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => { });
        }

        let deferredPrompt;
        const installBanner = document.getElementById("installBanner");
        const installBtn = document.getElementById("installBtn");

        window.addEventListener("beforeinstallprompt", (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBanner.classList.add("show");
        });

        installBtn.addEventListener("click", async () => {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === "accepted") installBanner.classList.remove("show");
            deferredPrompt = null;
        });

        window.addEventListener("appinstalled", () => {
            installBanner.classList.remove("show");
            deferredPrompt = null;
        });

        const bgColorInput = document.getElementById("bgColorInput");
        const colorHex = document.getElementById("colorHex");
        bgColorInput.addEventListener("input", () => {
            colorHex.textContent = bgColorInput.value.toUpperCase();
        });

        let qrCodeStyling = null;

        function generateQR() {
            const data = document.getElementById("linkInput").value.trim();
            const text = document.getElementById("textInput").value;
            const shape = document.getElementById("shapeInput").value;
            const bgColor = document.getElementById("bgColorInput").value;
            if (!data) {
                document.getElementById("linkInput").focus();
                return;
            }

            document.getElementById("emptyState").style.display = "none";
            document.getElementById("preview-wrapper").classList.add("active");
            document.getElementById("qr-card").style.backgroundColor = bgColor;
            document.getElementById("qr-text-display").innerText = text;

            const qrInner = document.getElementById("qr-inner");
            qrInner.innerHTML = "";

            let cornerSquareType = "square";
            let cornerDotType = "square";
            if (shape === "dots" || shape === "rounded" || shape === "extra-rounded") cornerSquareType = "extra-rounded";
            if (shape === "dots" || shape === "rounded") cornerDotType = "dot";

            const size = Math.min(280, Math.max(200, window.innerWidth - 120));

            qrCodeStyling = new QRCodeStyling({
                width: size,
                height: size,
                data: data,
                margin: 0,
                qrOptions: { errorCorrectionLevel: "H" },
                dotsOptions: { color: "#111A29", type: shape },
                backgroundOptions: { color: "#ffffff" },
                cornersSquareOptions: { color: "#111A29", type: cornerSquareType },
                cornersDotOptions: { color: "#111A29", type: cornerDotType }
            });

            qrCodeStyling.append(qrInner);
            document.getElementById("action-buttons").classList.add("show");
        }

        async function downloadImage() {
            const element = document.getElementById("qr-card");
            const canvas = await html2canvas(element, { scale: 5, backgroundColor: null, useCORS: true });
            const link = document.createElement("a");
            link.download = "QR_AwabSaif_2026.png";
            link.href = canvas.toDataURL("image/png", 1.0);
            link.click();
        }

        async function downloadPDF() {
            const element = document.getElementById("qr-card");
            const canvas = await html2canvas(element, { scale: 5, backgroundColor: null, useCORS: true });
            const imgData = canvas.toDataURL("image/png");
            const pdf = new window.jspdf.jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
            const pdfWidth = pdf.internal.pageSize.getWidth();
            const ratio = canvas.height / canvas.width;
            const widthToUse = pdfWidth - 40;
            const heightToUse = widthToUse * ratio;
            pdf.addImage(imgData, "PNG", 20, 20, widthToUse, heightToUse);
            pdf.save("QR_AwabSaif_2026.pdf");
        }

        document.getElementById("linkInput").addEventListener("keydown", (e) => {
            if (e.key === "Enter") generateQR();
        });
    </script>
</body>

</html>
